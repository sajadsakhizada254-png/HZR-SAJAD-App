<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>فالوورهای نمایشی</title>
<style>
body {
  background: #15131c;
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
  padding: 25px;
}
.card {
  max-width: 380px;
  margin: 30px auto;
  background: #252131;
  padding: 24px;
  border-radius: 22px;
}
button {
  background: #ff4f91;
  color: white;
  border: 0;
  border-radius: 12px;
  padding: 14px 24px;
  font-size: 17px;
}
.person {
  background: #393246;
  margin: 10px 0;
  padding: 13px;
  border-radius: 12px;
}
</style>
</head>
<body>
<div class="card">
  <h2>🎀 پروفایل من</h2>
  <p>💗 فالوورهای نمایشی</p>
  <button onclick="showFollowers()">نمایش فالوورها ✨</button>
  <div id="list"></div>
  <p>این فقط یک دمو است؛ فالوور واقعی تیک‌تاک اضافه نمی‌کند.</p>
</div>

<script>
function showFollowers() {
  const names = [
    "شیرن قندولک 🥹",
    "نازنین جان 💗",
    "ستاره کوچولو ✨",
    "مریم جان 🌸",
    "فرشته 🦋",
    "دختر باران 🌷",
    "ماه‌رخ 💕",
    "یلدا جان 🎀"
  ];

  document.getElementById("list").innerHTML =
    names.map(name => `<div class="person">${name}</div>`).join("");
}
</script>
</body>
</html>
